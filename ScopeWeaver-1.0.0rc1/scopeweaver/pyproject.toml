[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "scopeweaver"
version = "1.0.0rc1"
description = "Scope-enforced, read-only security assessment framework"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "ScopeWeaver contributors"}]
keywords = ["security", "pentest", "audit", "reconnaissance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "aiohttp>=3.12,<4",
  "dnspython>=2.7,<3",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "jinja2>=3.1.6,<4",
  "cryptography>=44,<50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8",
  "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2",
]

[project.scripts]
scopeweaver = "scopeweaver.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scopeweaver"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/examples", "/.github", "/*.md", "/LICENSE", "/pyproject.toml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]  # Ruff's formatter owns wrapping; evidence strings and URLs remain intact.

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["integration: real loopback services, never the public Internet"]

[tool.coverage.run]
source = ["scopeweaver"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
